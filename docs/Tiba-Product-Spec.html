aption-size);line-height:var(--text-caption-line);color:var(--text-muted)}\n.tb-overline{font-size:var(--text-overline-size);letter-spacing:var(--text-overline-tracking);text-transform:uppercase;font-weight:600;color:var(--text-muted)}\n<\u002Fstyle>\n<script src=\"a9181c2f-4458-4b4a-9604-6c96a6f78231\"><\u002Fscript>\n<style>doc-page:not(:defined){visibility:hidden}a{color:var(--text-link)}a:hover{color:var(--fern-900)}<\u002Fstyle>\n<\u002Fhelmet>\n<doc-page margin=\"0.75in\">\n<div style=\"font-family:var(--font-body);color:var(--ink-900)\">\n\n<h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:38px;line-height:1.15;color:var(--fern-800);margin:0 0 8px\">Tiba: Product Spec (Version 2)<\u002Fh1>\n<p style=\"font-size:15px;color:var(--ink-700);margin:0 0 20px\">Updated 20 Oct 2026 (profiles, contracts, duplicates, invoices, performance, build guide) · Draft for review · Replaces Version 1<\u002Fp>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Tiba is a website, used on phone and desktop, where clinicians keep every patient visit note in one place: tied to an appointment, signed, easy to find and ready to invoice. Version 2 adds a second kind of account, the <strong>administrator<\u002Fstrong>, who runs a practice with several clinicians, locations and insurers.<\u002Fp>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Core action is unchanged: <em>write and sign a note for a patient visit.<\u002Fem><\u002Fp>\n\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">1. What changed since Version 1<\u002Fh2>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:18%\">Area<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:27%\">Version 1<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:55%\">Version 2<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Accounts<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">One login: the clinician<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Two account types: clinician and administrator. Sign-in checks the type and opens the right app.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Sign up<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Name, email, password<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Adds practice name, type of account and practice logo (optional for clinicians, required for admins).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Visit notes<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">One free-text box<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Sections that change with the type of care, including PT, OT, ST, skilled nursing (RN or LPN) and CNA / home health aide notes. Tiba writes the finished note after signing.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Unsigned notes<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Not covered<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Saved as drafts automatically. Listed with finished visits that still need a note.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Screens<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Appointments, Visit note, Patient record<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Clinician: 10 screens. Admin: 16 screens. Plus sign up and a patient review page.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patients<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Signed on the device<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Also leave reviews for the practice from the sign-in page, with no account.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">States<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Normal only<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Every screen has live, loading and error versions.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">2. Who uses Tiba<\u002Fh2>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:18%\">Person<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:20%\">Account<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:62%\">What they do<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Clinician<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Regular account<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Sees their own appointments and patients, writes and signs notes, sends invoices.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Administrator<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Admin account<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Runs the practice: clinician accounts, every signed note, invoices, insurance billing, patients, locations, service agreements and reviews. Does not write visit notes.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patient<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">None<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Signs notes and service agreements on the clinician or admin device. Can leave a review of the practice.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">3. Accounts and access<\u002Fh2>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Sign in<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Email and password, plus \"Keep me signed in\".<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Tiba looks up the account type and opens the clinician app or the admin app.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Unknown email: \"We couldn't find an account for that email. Check it, or create one below.\"<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Links: <strong>Create an account<\u002Fstrong>, <strong>Leave a review<\u002Fstrong> (patients) and <strong>Check reviews from patients<\u002Fstrong>. The last asks for an admin sign-in and opens Reviews. A clinician who uses it is told only the admin can see reviews.<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Sign up<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:26%\">Field<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:74%\">Rule<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Your name<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Required.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Email<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Required and must u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Sign out<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Available on every device: Settings on phone and desktop, the account area of the desktop side menu, and the More screen in the admin phone app. Sign-out always returns to the sign-in page.<\u002Fp>\n\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">4. Clinician app<\u002Fh2>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Phone: top bar and bottom tabs (Visits, Notes, Patients, Settings). Desktop: side menu with Appointments, Notes to do, Patients and Settings, plus a live list of drafts.<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:24%\">Screen<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:76%\">What it does<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Appointments<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">A week strip with a dot for days that have notes to do. The day's visits, each with a status. A reminder links to Notes to do.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Notes to do<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Two lists: finished visits with no note yet, and drafts (started but unsigned) with sections done and last edit.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Visit note<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Type of care, diagnosis code and the sections for that type of care. Progress bar. Saves as a draft as you type. \"Save draft\" or \"Continue to sign\".<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Sign note<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Summary of the answers. Clinician signs; the patient signs too if that setting is on.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Signed note<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Locked. Shows the note Tiba wrote from the sections, the original answers and both signatures. Download PDF and Create invoice.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patients<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Search. Flags patients with a note to do.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patient record<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Details, diagnosis codes, visits with status, Download PDF, Create invoice.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Invoice<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Pick signed visits not yet invoiced, email and due date. Shows the total.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Add patient<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Name (required), date of birth, phone, email, diagnosis code. Admins also pick the clinician, insurer, date of referral and start of care.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Settings<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Patient-signs toggle, country (sets the currency), visit fee, privacy line, Sign out.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Visit status<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\"><strong>Upcoming<\u002Fstrong> → <strong>Needs note<\u002Fstrong> (visit finished) → <strong>Draft<\u002Fstrong> (note started) → <strong>Signed<\u002Fstrong> → <strong>Invoiced<\u002Fstrong>.<\u002Fp>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Note sections by type of care<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:24%\">Type of care<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:76%\">Sections<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Individual therapy<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Mood today (pick one) · What you worked on (pick any) · Approaches used (pick any) · What happened (text) · Risk check (pick one) · Plan and homework (text)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Couples therapy<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Who attended · What you worked on · Approaches used · What happened · Risk check · Plan and homework<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Assessment<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Reason for referral · How they presented · Relevant history · Risk check · Initial formulation · Recommendation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Follow-up call<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Reason for call · Update · Risk check · Agreed next step<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Every section must be filled before signing. Missing sections are named: \"Fill 2 more sections to sign: …\".<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Changing the type of care swaps the sections. Answers to shared sections stay.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">After signing, Tiba turns the answers into a written note. The prototype uses a fixed sentence pattern per type of care. Version 2 needs a decision on whether to use AI writing.<\u002Fli><\u002Ful>\n\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Discipline notes: PT, OT, ST, skilled nursing, CNA / HHA<\u002Fh3><p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">These note types are grouped in SOAP order: Subjective, Objective, Assessment, Plan, then Billing. On desktop a section outline sits beside the note with a done count per group; on phone the groups show as chips that jump to each part.<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:22%\">Type<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50)\">Sections<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Physical therapy<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: what they told you, pain (today, best, worst). O: measurements (range of motion, strength, Timed Up and Go), treatment given, response. A: goal progress, assessment. P: plan, visits per week. Billing: 97110, 97140, 97112, 97116, 97530 with minutes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Occupational therapy<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: what they told you. O: help needed with daily tasks (independent to max assist), grip and nine-hole peg, treatment given. A: goal progress, assessment. P: plan, visits per week. Billing: 97535, 97530, 97110, 97112, 97763 with minutes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Speech therapy<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: what they or their family told you. O: areas worked on, accuracy per target and trials, level of help. A: goal progress, assessment. P: plan, home practice. Billing: 92507, 92526, 92609 (once per visit).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\"><strong>Skilled nursing (RN or LPN)<\u002Fstrong> uses the same SOAP layout: what the patient or family said, pain, vital signs (temperature, pulse, respiration, blood pressure, oxygen, weight, blood sugar), body systems (normal, changed, not checked), wound size (optional), skilled care given, medicine review, goal progress, assessment, homebound status, teaching given, doctor contacted, plan, and G0299, G0300, G0162 and G0495 in 15-minute units.<\u002Fp>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\"><strong>CNA or home health aide visit<\u002Fstrong> follows the agency's paper form, in six numbered parts: (1) visit time arrived and left with total time, purpose, diet; (2) vital signs including blood pressure on both arms, skin, body area affected, thinking and alertness; (3) daily living tasks for cooking and eating, bathing and hygiene, mobility, dressing and grooming, each marked No help, Device, Standby, Min, Mod, Max or Total; (4) medicine help, medicines and times, meal log; (5) companion care and home help tasks; (6) other observations and the daily narrative. The aide and the patient both sign. Only tasks done that day need marking.<\u002Fp>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Timed codes add up minutes and show billable units using the 8-minute rule. Goal names are samples; in the real product they come from each patient's plan of care.<\u002Fp>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Diagnosis code field<\u002Fh3><p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">A type-to-filter list used everywhere a code is picked (visit note, add patient). Typing a code (F41) or words (anxiety, panic) narrows the list as you type. Arrow keys move through the matches, Enter picks one, Escape closes the list. The field can be cleared.<\u002Fp>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">4b. Evaluations, progress notes and the aide service plan<\u002Fh2>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Discipline care runs in three steps: an <strong>initial evaluation<\u002Fstrong> sets the goals, <strong>progress notes<\u002Fstrong> rate those goals at each visit, and, when a home health aide is ordered, an <strong>aide service plan<\u002Fstrong> must be signed before any aide visit can be documented.<\u002Fp>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Initial evaluations<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:22%\">Evaluation<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:58%\">Sections<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:20%\">Codes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">PT evaluation<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: reason for referral, history, medical history, prior function, home setup, what they want back. O: pain, range of motion and strength, Timed Up and Go, Berg, 30-second chair stand, mobility levels. A: assessment, complexity, rehab potential, <strong>goals<\u002Fstrong>. P: visits, duration, planned treatment.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">97161, 97162, 97163<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">OT evaluation<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: occupational profile, history, prior function, home setup. O: daily task levels, grip and nine-hole peg, thinking and safety. A: assessment, complexity, <strong>goals<\u002Fstrong>. P: visits, duration, planned treatment.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">97165, 97166, 97167<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">ST evaluation<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: case history, areas of concern. O: tests given, standard score, percentile, intelligibility, oral mechanism. A: assessment, severity, <strong>goals<\u002Fstrong>. P: visits, duration, home program.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">92521, 92522, 92523, 92610<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Skilled nursing start of care (RN)<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">S: reason for home care, medical history, why homebound. O: vital signs, body systems, wound (optional), MAHC-10 fall risk, medicine list check. A: assessment, <strong>goals<\u002Fstrong>. P: services to request, visit plan, emergency plan.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">G0299<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Each goal has text, short- or long-term, and a target (2, 4, 8 or 12 weeks). At least one goal is needed to sign.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Goals come only from a signed evaluation in the same practice.<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Progress notes<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Goal progress<\u002Fstrong> lists the goals from the latest signed evaluation for that discipline, each rated Met, Progressing or Not yet, with the evaluation date and author shown. With no signed evaluation, the section says so instead.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Prefill from last visit<\u002Fstrong> appears on every progress note. It copies the latest signed note of the same type for the same patient, and the clinician then edits anything. Billing minutes and visit times are not copied. A banner shows where the copy came from, with Undo.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Prefill works across clinicians in the same practice. If the only earlier notes are from another practice, the button is replaced by: \"Notes from other practices can’t be copied.\"<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Aide service plan<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">A separate note with its own screen, one per patient, following the home health aide care plan the agency uses to direct aide work (frequency, precautions, tasks and supervision).<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:24%\">Part<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:76%\">What it records<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">1. Orders<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Aide visits per week, for how long, visit length.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">2. Safety<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Precautions, activity allowed, diet, and when to call the nurse or therapist (temperature, pulse, blood pressure, blood sugar limits).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">3. Personal care<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Bath type; each task (bathing, hair, mouth, shaving, skin, nails file only, dressing, toileting, catheter care) set to Every visit, As needed or Not needed.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">4. Mobility and meals<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Transfers, walking help, range of motion, turning; meal prep, help with eating, fluids.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">5. Home and medicines<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Housekeeping, laundry, linens, errands; medicine reminders only.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">6. Goals and supervision<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Goals of aide care, what to report right away, supervisory visit every 14 days (skilled care ongoing) or every 60 days (aide only).<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:24%\">Rule<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:76%\">Behaviour<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Who writes it<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">RN when skilled nursing is ordered. PT or OT only when no nurse is ordered and PT or OT is on the case. Anyone else sees why they can’t, with no edit controls.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Aide visits<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">An HHA / CNA visit note is locked until the plan is signed. The lock explains why and links to the plan or the care team.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Signing<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Author and patient both sign. The patient record shows plan status and who wrote it.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Patients<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Admins and clinicians can both add patients.<\u002Fstrong> Add patient records name, contact details, diagnosis code, services ordered (skilled nursing, PT, OT, ST, home health aide, social work) and the ordering doctor. An aide can’t be ordered without a nurse, PT or OT on the case.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Clinicians add from their Patients list or from a search with no match. Admins also set the assigned clinician, insurer, referral date and start of care. Every new patient joins the practice list for everyone.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">The clinician patient record shows a <strong>Care team<\u002Fstrong> card: services ordered, which evaluations have set goals, and the aide service plan status.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Each clinician sets their discipline in Settings (RN, LPN, PT, OT, SLP, HHA / CNA, mental health). It decides which plans they can write.<\u002Fli><\u002Ful>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">5. Admin app<\u002Fh2>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Desktop side menu, grouped as Overview; People (Clinicians, Patients); Work (Appointments, Completed notes, Invoices, Insurance billing); Practice (Locations, Patient reviews, Settings). The top shows the practice logo and name; the bottom shows the admin name and Sign out. Phone: tabs for Overview, Patients, Billing and More.<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:24%\">Screen<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:76%\">What it does<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Overview<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Practice logo, name and admin name. \"Needs your attention\": notes unbilled 30+ days, agreements waiting for the admin, deactivated accounts, new reviews. Today's visits across the practice.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Clinicians<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Every clinician with Active or Deactivated status.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Clinician profile<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Details (role, email, phone, registration, location, joined). Account active toggle; deactivating asks to confirm and keeps their notes. Emergency contact (name, relationship, phone). Documents.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patients<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Active and Discharged tabs, search, assigned clinician, agreement status. <strong>Add patient<\u002Fstrong>, like clinicians can.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patient details<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Details, date of referral, start of care, assigned clinician, Discharge or Reactivate, clinical documents, service agreement.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Service agreement<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Filled from the patient and practice details. Patient and admin both sign on the device. Downloadable as a PDF once fully signed.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Appointments<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Upcoming visits for every clinician, grouped by day, filter by clinician.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Completed notes<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Every signed note, newest first, filter by clinician, with billed status. Opens the note, with Download PDF and Mark as billed.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Invoices<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Every invoice clinicians have sent, with status (Sent, Paid, Overdue). Filter by clinician. Tap to download the PDF.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Insurance billing<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">\"Waiting to bill\" and \"Billed\", each oldest first. Rows over 30 days are red. Send reminder.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Locations<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Every location and its address. <strong>Add location<\u002Fstrong>: name, type of facility, address (optional for online) and at least one service.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Location profile<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Address and clinicians there, type of facility, type of services, and PDF files with a short description that can be downloaded or removed. <strong>Remove location<\u002Fstrong> asks to confirm; clinicians based there are moved to a location you pick. The last location can't be removed.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patient reviews<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Average rating and every review, newest first. Admin only.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Settings<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Practice name, country (sets the currency), admin name, practice logo (required), Sign out.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Insurance billing rules<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">A note counts as waiting from the day it is signed until it is marked as billed to insurance.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Both lists sort oldest first. Waiting rows show the days waited; red after 30 days.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Send reminder<\u002Fstrong> lists every note waiting more than 30 days and notifies the clinician who signed each one. The page then shows when the last reminder was sent.<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Service agreement<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">States: Not started → Generated → Patient signed or Admin signed → Fully signed.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Either person can sign first; the record shows who is still needed.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">The fully signed PDF includes the practice, patient, clinician, every section and a \"signed electronically\" line with date and time for each person.<\u002Fli><\u002Ful>\n<div style=\"break-inside:avoid;padding:14px 18px;border-radius:12px;background:var(--lilac-100);color:var(--lilac-700);font-size:14px;line-height:1.55;margin:8px 0 14px\">The agreement wording is a placeholder (care, fees, cancelling, confidentiality, records, ending care) until the real outline arrives.<\u002Fdiv>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Documents and files<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:22%\">Where<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:36%\">What<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:42%\">Rules<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Clinician profile<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Registration, insurance, DBS check, contracts<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">PDF, Word or image. Description optional. Only admins can see them.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patient details<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Referral letters, reports, test results<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">PDF, Word or image. Description optional.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Location profile<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Certificates, leases, policies<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">PDF only. Short description required.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Every file shows its name, description, size and upload date, and can be downloaded or removed.<\u002Fp>\n\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">5b. Duplicates, invoices, notifications and performance<\u002Fh2>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Duplicate patient check<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Runs whenever a patient is added, by an admin or a clinician. A match means the same name and the same date of birth. Names are compared ignoring case, spaces and punctuation (e.g. \"AMINA HASSAN\" = \"Amina Hassan\").<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">The warning shows as soon as both fields match, before saving: \"Possible duplicate. Amina Hassan, born 14 Mar 1992, is already in your practice.\"<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Clinician:<\u002Fstrong> can open the existing record, or choose \"Add and ask admin to check\". The patient is saved with a <em>Possible duplicate<\u002Fem> flag, shows \"Admin checking\" in the list, and the record shows a notice.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Admin:<\u002Fstrong> can open the existing record, or confirm \"It’s a different person\" and save. No flag is raised.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Admin review screen:<\u002Fstrong> existing record and new entry side by side, matching fields in green. \"Confirm new patient\" clears the flag. \"Merge into existing\" keeps the original record, moves any notes from the new entry and hides it.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Flags appear in Overview \"Needs your attention\", in Notifications and as a badge on Patients.<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Invoices from clinicians<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:16%\">Status<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:52%\">Meaning<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:32%\">Actions<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Unpaid<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Sent by a clinician, no payment recorded. Shows days since sent; red \"Overdue\" after 30 days.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Record payment (date, paid by), Flag issue, Download PDF<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Paid<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Payment recorded by the admin.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Download PDF<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Issue<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Admin flagged a problem: category plus a required comment. The clinician is told.<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Record payment, Resolve issue (back to Unpaid), Download PDF<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Issue categories: Wrong amount, Wrong patient, Missing or unsigned note, Insurance denied, Duplicate invoice, Other.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Payment methods: Insurance, Card, Cash, Bank transfer, Check (US) or M-Pesa (Kenya).<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Each invoice keeps a history: sent, issue flagged, issue resolved, marked paid.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Every new invoice is \"New\" until the admin opens it, or taps \"Mark all as seen\".<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">The Invoices screen has Unpaid, Paid and Issues tabs with counts and a clinician filter.<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Notifications<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">One list for the admin: new invoices, possible duplicates, new reviews, and notes unbilled for 30+ days. Each item opens the screen where it’s handled. The count shows on the Notifications menu item and on the More tab on phone.<\u002Fp>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Performance<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:24%\">Measure<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:76%\">Rule<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Period<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Last 7 days, Last 30 days (default), Last 90 days, This year.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Patients admitted<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Patients whose added date (or start of care, or referral) falls in the period. Merged duplicates are not counted.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Invoices sent<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Count and total of invoices sent in the period.<\u002Fsc-raw-td><\u002Fsc sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:20%\">Section<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:80%\">Fields and rules<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">About you<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Discipline (RN, LPN, PT, OT, SLP, HHA / CNA, mental health) and speciality. License number, issuing board and expiry for licensed disciplines (optional; hidden for aides and CNAs).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Education<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Any number of entries, every level: Certificate, Diploma, Associate, Bachelor’s, Master’s, Doctorate, Other; course or qualification (required), school, year.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Certifications<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Name (required), issuer, expiry with a Current / Expires soon (within 60 days) / Expired badge. Quick-add for BLS, CPR, First Aid, HHA and CNA certification. Aides and CNAs must have at least one.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Documents<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Resume or CV (optional), W-9 or other IRS form (optional): upload, replace, download, remove. Signed contracts are listed automatically and download as PDF.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">Admins see the same information on each clinician’s page (Qualifications, Education, Certifications, Profile documents) and can download every document.<\u002Fp>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Contracts<\u002Fh3>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:22%\">Status<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:16%\">Who acts<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:62%\">What happens<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\"> ight:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Clinician signed and sent it back. Admin is notified to check it under Contracts. Both can download the PDF; it is listed on the clinician’s profile.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Create a contract (admin):<\u002Fstrong> clinician, type (Independent contractor agreement, Employment offer, Confidentiality agreement), start date, length, pay, role or services, other terms, with a live preview on the letterhead.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Letterhead:<\u002Fstrong> practice logo from Settings plus address, phone and email, saved for every contract. An uploaded letterhead image can replace the text version. With no logo, initials show and the admin is told to add one.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Signing:<\u002Fstrong> the admin signs before sending; the clinician signs on their device. Signatures are drawn and stored as images with name and date.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Messages:<\u002Fstrong> one thread per contract. Each new message notifies the other side.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Notifications:<\u002Fstrong> clinician — new contract to sign, admin replied. Admin — clinician messaged, clinician signed; also shown on Overview and as menu badges.<\u002Fli><\u002Ful>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">6. Patient reviews<\u002Fh2>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Opened from the sign-in page. No account needed.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 =\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Sign a contract or message about it<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Own contracts<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Reply, update and resend<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">See reviews, performance, notifications<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">No<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Activate or deactivate accounts, locations, settings<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">No<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Acceptance criteria (new in this update)<\u002Fh3>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Adding a patient with the same normalised name and DOB as an existing practice patient shows the duplicate warning before save.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">A clinician-added duplicate is saved with a flag, creates an admin notification, and appears on Overview until confirmed or merged.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Merging hides the new record, moves its notes to the original and leaves an audit entry.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Every invoice a clinician sends creates an admin notification and appears in Unpaid with a New badge.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Flagging an issue requires a category and a comment, moves the invoice to Issues and notifies the clinician.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Resolving an issue returns it to Unpaid; recording a payment moves it to Paid from either Unpaid or Issue.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Performance numbers change with the period and match the underlying records.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">HHA notes cannot be saved or signed until the patient has a signed service plan.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Progress notes show goals only from a signed evaluation in the same practice.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Prefill copies fields except billing minutes and visit times, and is unavailable when the source note is from another practice.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">A sent contract appears in the clinician’s Contracts and Notifications; signing marks it Signed for both and notifies the admin.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">A clinician message on a contract notifies the admin; an admin reply notifies the clinician.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Contracts can’t be sent without the admin’s signature; the letterhead uses the practice logo and saved contact details.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Aides and CNAs can’t save a profile without at least one certification.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\">Every screen has live, loading and error states as drawn.<\u002Fli><\u002Ful>\n<h3 style=\"font-family:var(--font-body);font-size:17px;font-weight:600;color:var(--ink-900);margin:22px 0 6px\">Design system additions<\u002Fh3>\n<p style=\"font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--ink-900)\">These patterns were built in this project on top of the Tiba Design System and should be added to it as components:<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;margin:8px 0 16px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:36%\">Pattern<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:13px;font-weight:600;color:var(--fern-800);padding:8px 10px;border-bottom:1.5px solid var(--fern-200);background:var(--fern-50);width:64%\">Use<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">SideNav with groups, badges and drafts<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Desktop navigation for clinician and admin apps.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Section outline / jump chips<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">SOAP or numbered note sections; outline on desktop, chips on phone, with done counts.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Choice chips (single and multi)<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Tap answers in notes and forms; 44px minimum.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Measures grid<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Number inputs with units (vitals, ROM, scores); time inputs for visits.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Level rows<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">A row per item with a level picker (goal progress, ADL help levels, aide tasks).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Goal set editor<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Goal text, short/long-term and target, add and remove.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Billing codes table<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Timed codes with minutes and 8-minute-rule units, untimed codes as Add toggles.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Combobox<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Type-to-filter diagnosis code picker with keyboard support.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Signature pad and signed signature tile<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Draw, clear, locked display.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Notice banners<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Info (fern), waiting (lilac), warning (amber, e.g. duplicates), danger (red, e.g. issues), prefill with Undo.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Locked state<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Explains why an action is blocked, with one way forward.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Stat card, split bar, clinician metric row<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Performance page.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Skeleton list and form<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Loading states.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top;font-weight:600\">Error block and banner<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--ink-100);vertical-align:top\">Full error for lists, banner for forms that keeps input.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;color:var(--fern-800);margin:36px 0 10px\">11. Open questions<\u002Fh2>\n<ul style=\"margin:0 0 12px;padding-left:20px\"><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Service agreement outline:<\u002Fstrong> waiting on the real wording and sections.<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Clinician documents:<\u002Fstrong> which document types are required, and do any expire?<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Billing reminders:<\u002Fstrong> sent to clinicians only, or also to billing staff? By email, in-app, or both?<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Insurance billing:<\u002Fstrong> marked by hand for now. Is there an insurer system to connect to?<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Written notes:<\u002Fstrong> fixed sentence pattern or AI writing?<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Signature images in PDFs:<\u002Fstrong> the prototype records an electronic-signature line; should the drawn signature appear too?<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Reviews:<\u002Fstrong> how do patients reach the right practice (link, QR code)? Should admins be able to reply to or hide reviews?<\u002Fli><li style=\"font-size:15px;line-height:1.6;margin:0 0 4px\"><strong>Currency:<\u002Fstrong> sample prices show as $80.00 or KSh 8,000. Should one practice be able to bill in both currencies at once?<\u002Fli><\u002Ful>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\"><\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
